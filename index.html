<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI Duo - 지능형 채팅 어시스턴트">
    <title>AI Duo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            background: #f5f7fa;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-content h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .header-content p {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .chat-wrapper {
            flex: 1;
            overflow: hidden;
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .chat-container {
            flex: 1;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        iframe {
            flex: 1;
            border: none;
            border-radius: 16px;
        }

        .sidebar {
            width: 280px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            padding: 20px;
            overflow-y: auto;
            display: none;
        }

        @media (max-width: 1024px) {
            .sidebar {
                display: none;
            }
        }

        @media (max-width: 768px) {
            .chat-wrapper {
                padding: 12px;
                gap: 12px;
            }

            .header {
                padding: 16px 20px;
            }

            .header-content h1 {
                font-size: 20px;
            }
        }

        /* 스크롤바 스타일 */
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #e0e0e0;
            border-radius: 3px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #b0b0b0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="header-icon">🤖</div>
            <div class="header-content">
                <h1>AI Duo</h1>
                <p>지능형 채팅 어시스턴트</p>
            </div>
        </div>

        <!-- 메인 콘텐츠 -->
        <div class="chat-wrapper">
            <div class="chat-container">
                <iframe 
                    src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_bot_ymR7dk/webchat?__version__=2&enableFileAttachment=false&cliAgent=true" 
                    title="AI Duo 채팅 어시스턴트"
                    allow="microphone; geolocation; midi; camera; payment; usb"
                    loading="lazy">
                </iframe>
            </div>

            <!-- 사이드바 (확장 가능) -->
            <aside class="sidebar">
                <h3 style="font-size: 16px; margin-bottom: 16px; color: #333;">최근 대화</h3>
                <div style="color: #999; font-size: 13px; text-align: center; padding: 20px 0;">
                    대화 내역이 표시됩니다.
                </div>
            </aside>
        </div>
    </div>
</body>
</html>

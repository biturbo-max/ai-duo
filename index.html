<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Duo Connect AI - 지능형 AI 챗봇 플랫폼">
    <title>Duo Connect AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #475569;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--background);
            color: var(--text-primary);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, var(--background) 0%, var(--surface) 100%);
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 1.5rem 2rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            backdrop-filter: blur(10px);
        }

        .header-title {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-title p {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 500;
        }

        .chat-wrapper {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .chat-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 0;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--surface-light);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .footer a:hover {
            color: var(--secondary-color);
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .header {
                padding: 1rem 1.5rem;
            }

            .header-title h1 {
                font-size: 1.25rem;
            }

            .header-title p {
                font-size: 0.75rem;
            }

            .footer {
                padding: 0.75rem 1.5rem;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <div class="header-icon">🤖</div>
            <div class="header-title">
                <h1>Duo Connect AI</h1>
                <p>지능형 AI 어시스턴트</p>
            </div>
        </div>

        <!-- 채팅 영역 -->
        <div class="chat-wrapper">
            <div class="loading">
                <div class="spinner"></div>
                <div class="loading-text">AI 어시스턴트 로딩 중...</div>
            </div>
            <iframe 
                src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_bot_ymR7dk/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
                allow="microphone; camera"
                allowfullscreen>
            </iframe>
        </div>

        <!-- 푸터 -->
        <div class="footer">
            <p>© 2026 Duo Connect AI. 모든 권리 보유. | <a href="#">개인정보처리방침</a></p>
        </div>
    </div>

    <script>
        // 페이지 로드 후 로딩 표시 숨기기
        window.addEventListener('load', () => {
            const loadingEl = document.querySelector('.loading');
            if (loadingEl) {
                setTimeout(() => {
                    loadingEl.style.opacity = '0';
                    loadingEl.style.pointerEvents = 'none';
                    loadingEl.style.transition = 'opacity 0.3s ease';
                }, 1000);
            }
        });
    </script>
</body>
</html>
